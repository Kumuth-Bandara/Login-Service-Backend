services:

  app:
    build: .
    container_name: login-backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: login_db
      JWT_SECRET: your_jwt_secret
      JWT_EXPIRES_IN: 1h
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: login-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: login_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: